<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poultry Coop Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>Poultry Coop Monitoring</h1>
    
    <div class="grid">
      <div class="card">
        <h3>Temperature</h3>
        <p class="value" id="temp">-- °C</p>
      </div>
      <div class="card">
        <h3>Humidity</h3>
        <p class="value" id="humidity">-- %</p>
      </div>
      <div class="card">
        <h3>Gas Level</h3>
        <p class="value" id="gas">-- PPM</p>
      </div>
      <div class="card">
        <h3>Feed Level</h3>
        <p class="value" id="feed">-- %</p>
      </div>
      <div class="card">
        <h3>Water Level</h3>
        <p class="value" id="water">-- %</p>
      </div>
      <div class="card">
        <h3>Exhaust Fan Status</h3>
        <p class="value" id="fan-status">OFF</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
